[project]
name = "mic-s3"
version = "0.1.0"
description = "S3 microservice for PDF/Excel ingestion"
requires-python = ">=3.12"
dependencies = [
    "amiga-framework[rest-server,database-sql]",
    "alembic",
    "pdfplumber",
    "openpyxl",
]

[project.scripts]
app-start = "mic_s3.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mic_s3"]
